name: CI - Check

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "README.md"
      - "LICENSE"
      - "screenshots/**"
      - "example.env"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "README.md"
      - "LICENSE"
      - "screenshots/**"
      - "example.env"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:once

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
